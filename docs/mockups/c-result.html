<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>轮末复盘 · 模糊音克星（方案 C 高保真稿）</title>
<link rel="stylesheet" href="c-base.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="brand-logo">拼</div>
    <span class="brand-name">模糊音克星</span>
  </div>
  <nav>
    <a href="c-home.html" class="active">练习</a>
    <a href="c-stats.html">统计</a>
    <a href="c-mastered.html">已掌握</a>
    <a href="c-wrongbook.html">错题本</a>
  </nav>
  <div class="spacer"></div>
  <div class="right">本轮已完成</div>
</header>

<div class="layout">
  <aside class="sider">
    <a class="menu-item active" href="c-home.html"><span class="menu-icon">▣</span>练习</a>
    <a class="menu-item" href="c-stats.html"><span class="menu-icon">▤</span>统计</a>
    <a class="menu-item" href="c-mastered.html"><span class="menu-icon">✓</span>已掌握</a>
    <a class="menu-item" href="c-wrongbook.html"><span class="menu-icon">✕</span>错题本</a>
  </aside>

  <main class="main">
    <div class="page">
      <div class="crumb">练习 <b>/ 轮末复盘</b></div>

      <div class="ant-card result-hero">
        <div class="result-emoji">🎉</div>
        <div class="result-score">80<small>%</small></div>
        <div class="result-summary">本轮 10 题 · 答对 8 · 答错 2 · 用时 2 分 15 秒</div>
        <div class="mt-5">
          <div class="progress" style="max-width:420px;margin:0 auto;height:12px">
            <div class="bar" style="width:80%"></div>
          </div>
        </div>
        <div class="mt-5" style="display:flex;justify-content:center;gap:12px">
          <a class="ant-btn primary lg" href="c-quiz.html">错题重练（2 题）</a>
          <a class="ant-btn lg" href="c-home.html">再练一轮</a>
          <a class="ant-btn lg" href="c-stats.html">查看统计</a>
        </div>
        <div class="mt-3" style="font-size:13px;color:var(--text-3)">
          2 道错题已自动加入错题本 · 1 个字已标记「已掌握」
        </div>
      </div>

      <div class="mt-5 ant-card">
        <div class="card-body">
          <div class="row-between" style="margin-bottom:12px">
            <span style="font-size:15px;font-weight:500">本轮错题清单</span>
            <span class="ant-tag red">2 题待重练</span>
          </div>
          <table class="ant-table">
            <thead><tr><th>字</th><th>词语</th><th>音对</th><th>你的选择</th><th>正确读音</th><th>掌握状态</th></tr></thead>
            <tbody>
              <tr>
                <td class="word-cell">津</td>
                <td>天津</td>
                <td><span class="ant-tag pair-in">in/ing</span></td>
                <td><span class="ant-tag red">jīng</span></td>
                <td><b style="color:var(--success)">jīn</b></td>
                <td><span class="ant-tag">待重练</span></td>
              </tr>
              <tr>
                <td class="word-cell">令</td>
                <td>命令</td>
                <td><span class="ant-tag pair-in">in/ing</span></td>
                <td><span class="ant-tag red">lìn</span></td>
                <td><b style="color:var(--success)">lìng</b></td>
                <td><span class="ant-tag">待重练</span></td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <div class="mt-5 ant-alert info">
        <span>ℹ</span>
        <span>交互说明：本轮结束自动进入本页；「错题重练」仅抽取本轮错题再次出题；「再练一轮」同参数生成全新一轮。</span>
      </div>
    </div>
  </main>
</div>

</body>
</html>
